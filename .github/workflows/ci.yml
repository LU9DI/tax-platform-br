name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: tax_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tax -d tax_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tax:tax@localhost:5432/tax_platform_test
      TAX_TEST_DATABASE_URL: postgresql://tax:tax@localhost:5432/tax_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Bootstrap disposable PostgreSQL database
        run: npx tsx scripts/ci-bootstrap.ts
      - name: Apply migrations and verify integrity
        run: npx tsx scripts/migrate.ts
      - name: Typecheck
        run: npm run check
      - name: Run test suite
        run: npm test
