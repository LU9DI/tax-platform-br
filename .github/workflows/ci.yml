name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: tax_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tax -d tax_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tax:tax@localhost:5432/tax_platform_test
      TAX_TEST_DATABASE_URL: postgresql://tax:tax@localhost:5432/tax_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Bootstrap application schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema.sql
      - name: Seed disposable CI company
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO app_users (id,email,password_hash)
          VALUES ('00000000-0000-4000-8000-000000000001','ci@example.test','not-used')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO tax_companies (id,user_id,legal_name,cnpj,regime)
          VALUES (
            '00000000-0000-4000-8000-000000000002',
            '00000000-0000-4000-8000-000000000001',
            'CI Test Company',
            '00000000000191',
            'mei'
          )
          ON CONFLICT (id) DO NOTHING;
          SQL
      - name: Apply migrations and verify integrity
        run: npx tsx scripts/migrate.ts
      - name: Typecheck
        run: npm run check
      - name: Run test suite
        run: npm test
